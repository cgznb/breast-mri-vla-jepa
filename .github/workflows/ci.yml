name: CPU validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[raw,test,analysis]' build
      - name: Check repository contents
        run: python tools/check_publication.py
      - name: Run existing tests
        run: python -m pytest -q
      - name: Run fixed and dynamic CPU examples
        run: |
          python train.py smoke-vla-jepa --config configs/raw_vla_jepa_smoke_t0.yaml --output runs/ci_smoke_t0
          python train.py smoke-vla-jepa --config configs/raw_vla_jepa_smoke_dynamic.yaml --output runs/ci_smoke_dynamic
      - name: Build source and wheel distributions
        run: python -m build
